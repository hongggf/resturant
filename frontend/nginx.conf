server {
    listen 80;
    server_name vongpos.com www.vongpos.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vongpos.com www.vongpos.com;

    ssl_certificate /etc/letsencrypt/live/vongpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vongpos.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html names every hashed asset, so it must never be served stale:
    # a cached copy pointing at chunks a later deploy deleted breaks the app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes these filenames, so a given URL's bytes never change
    # and the response can be cached permanently. =404 instead of the SPA
    # fallback below, so a missing chunk fails loudly rather than arriving as
    # HTML with a 200 and tripping the module MIME check.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Not immutable: these filenames are stable, and `npm run images` rewrites
    # the same paths with new bytes. A week of caching with a day of
    # stale-while-revalidate keeps repeat visits off the network while still
    # letting a regenerated image roll out on its own.
    location /food-images/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
